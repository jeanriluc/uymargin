<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UyMargin - Analizador de Rentabilidad Mayorista</title>
    <meta name="description" content="Dashboard financiero SaaS y simulador de márgenes para e-commerce y mayoristas en Uruguay (Mercado Libre, Tienda Propia, DGI e impuestos)." />
    <meta property="og:title" content="UyMargin - Analizador de Rentabilidad Mayorista" />
    <meta property="og:description" content="Dashboard financiero SaaS y simulador de márgenes para e-commerce y mayoristas en Uruguay (Mercado Libre, Tienda Propia, DGI e impuestos)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica el tema antes de pintar, para que no haya parpadeo. Mismo criterio que src/lib/theme.ts.
      (function () {
        var choice = "auto";
        try {
          var saved = localStorage.getItem("uymargin:theme:v2");
          if (saved === "light" || saved === "dark" || saved === "auto") choice = saved;
        } catch (e) {}
        var dark = choice === "dark" || (choice === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
