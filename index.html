    <script>
      // Aplica el tema antes de pintar, para que no haya parpadeo. Mismo criterio que src/lib/theme.ts:
      // oscuro solo si el usuario lo eligió; en cualquier otro caso, claro.
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("uymargin:theme:v2") === "dark") theme = "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
